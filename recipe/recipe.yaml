context:
  python_min: "3.11"
  name: "sisl"
  version: "0.20.0"
  sha256: "f32c290e157387c30163cde8315a3b66f1cb46f09d17d16d8e1da7c6974790f0"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/zerothi/${{ name }}/archive/v${{ version }}.tar.gz
  sha256: ${{ sha256 }}
  patches:
    - patches/nofortran-tests.patch
    - patches/zipfile-tests.patch

build:
  number: 0
  skip:
    - match(python, "<${{ python_min }}")

requirements:
  build:
    - cmake
    - if: win
      then:
        - ninja
      else:
        - make
    - ${{ compiler('fortran') }}
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    # The below python packages are necessary for cross-compilation
    - if: build_platform != host_platform
      then:
        - python
        - cross-python_${{ host_platform }}
        - cython >=3.0.8
        - numpy >=2.1.0
  host:
    - libblas
    - libcblas
    - liblapack
    - python
    - pip
    - pyproject-metadata
    - setuptools_scm >=8
    - scikit-build-core >=1
    - cython >=3.0.8
    # a build problem occurs with 1.22.* (infinite recursion on module creation)
    - numpy >=2.1.0
  run:
    - python
    - pyparsing >=2.2.1
    - numpy >=2.1.0
    - scipy >=1.15
    - tqdm >=4.36
    - xarray >=2024.3
    - netcdf4
  run_constraints:
    - dill >=0.3.2

tests:
  - python:
      imports:
        - sisl
        - sisl.io
        - sisl.geom
        - sisl.linalg
        - sisl.mixing
        - sisl.physics
        - sisl.shape
        - sisl.unit
        - sisl.utils
        - sisl_toolbox.btd
        # We currently don't support fortran on windows
        - if: not win
          then: sisl.io.siesta._siesta
      pip_check: true

  - script:
     - PYTHONUNBUFFERED=1 pytest . -m "not slow" --timeout=60 --capture=tee-sys -v
    requirements:
      run:
        - pytest
        - pytest-timeout
        - matplotlib
        - nodify
        - plotly
        - scikit-image

about:
  license: MPL-2.0
  license_family: MOZILLA
  license_file: LICENSE
  summary: Toolbox for electronic structure calculations and large scale transport
  description: |
    sisl is a tool to manipulate density functional
    theory code input and/or output. It also implements tight-binding
    tools to create and manipulate multi-orbital (non)-orthogonal basis sets.
  homepage: https://github.com/zerothi/sisl
  documentation: https://zerothi.github.io/sisl
  repository: https://github.com/zerothi/sisl

extra:
  recipe-maintainers:
    - zerothi
